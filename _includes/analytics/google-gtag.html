<!-- Global site tag (gtag.js) - Google Analytics -->
<script async src="https://www.googletagmanager.com/gtag/js?id={{ site.analytics.google-gtag.tracking_id }}"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag() { dataLayer.push(arguments); }
  gtag('js', new Date());

  gtag('config', '{{ site.analytics.google-gtag.tracking_id }}', { 'anonymize_ip': {{ site.analytics.google-gtag.anonymize_ip | default: false }}});
</script>
